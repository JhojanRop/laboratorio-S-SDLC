[project]
name = "laboratorio-ssdlc"
version = "0.1.1"
description = "Laboratorio academico intencionalmente vulnerable para practicas de S-SDLC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.bandit]
# app.py y database.py son vulnerables a proposito (material del taller).
exclude_dirs = [".venv", "uploads", "tests", "app.py", "database.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
